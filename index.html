
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Airmax Sneakers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <div class="product">

            <!-- Left Side: Product Image -->

            <div class="product-image">

                <div class="orange-background"></div>

                <img
                    src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80"
                    alt="Sports Sneakers"
                >

                <p class="image-text">NEW COLLECTION</p>

            </div>

            <!-- Right Side: Product Details -->

            <div class="product-details">

                <div class="header">

                    <h2 class="logo">Airmax</h2>

                    <p class="icons">
                        &#9906; &nbsp; &#9786; &nbsp; &#128722;
                    </p>

                </div>

                <p class="collection">WINTER COLLECTION</p>

                <h1>Men Black Sneakers</h1>

                <p class="description">
                    Comfortable, stylish and perfect for everyday wear.
                    Discover your new favourite sneakers.
                </p>

                <!-- Product Price -->

                <div class="price">
                    <span class="new-price">$150</span>
                    <span class="old-price">$200</span>
                </div>

                <p class="heading">SELECT SIZE</p>

                <!-- Shoe Sizes -->

                <div class="sizes">

                    <label>
                        <input type="radio" name="size" value="7">
                        7
                    </label>

                    <label>
                        <input type="radio" name="size" value="8" checked>
                        8
                    </label>

                    <label>
                        <input type="radio" name="size" value="9">
                        9
                    </label>

                    <label>
                        <input type="radio" name="size" value="10">
                        10
                    </label>

                    <label>
                        <input type="radio" name="size" value="11">
                        11
                    </label>

                </div>

                <p class="heading">SELECT COLOR</p>

                <!-- Shoe Colors -->

                <div class="colors">

                    <label>
                        <input type="radio" name="color" value="yellow">
                        <span class="yellow"></span>
                    </label>

                    <label>
                        <input type="radio" name="color" value="black" checked>
                        <span class="black"></span>
                    </label>

                    <label>
                        <input type="radio" name="color" value="blue">
                        <span class="blue"></span>
                    </label>

                </div>

                <!-- Product Buttons -->

                <div class="buttons">

                    <a href="#" class="buy-button">Buy Now</a>

                    <a href="#" class="cart-button">Add To Cart</a>

                </div>

                <p class="footer-text">
                    PREMIUM QUALITY &nbsp; | &nbsp; FREE DELIVERY
                </p>

            </div>

        </div>

        <p class="bottom-text">MOVE WITH CONFIDENCE</p>

    </div>

</body>
</html>
